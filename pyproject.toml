[project]
name = "bot0-thought-graph"
version = "0.1.0"
description = "Reusable LLM-powered thought generation and interview pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.9",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.39",
    "openai>=1.54",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bot0_thought_graph*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
